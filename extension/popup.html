<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Antigravity Bridge</title>
    <style>
        body {
            width: 320px;
            margin: 0;
            padding: 16px;
            background: #090d16;
            color: #f3f4f6;
            font-family: system-ui, -apple-system, sans-serif;
            font-size: 13px;
        }
        .header {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 14px;
            border-bottom: 1px solid rgba(255,255,255,0.08);
            padding-bottom: 10px;
        }
        .logo {
            width: 28px;
            height: 28px;
            border-radius: 6px;
        }
        .title {
            font-weight: 700;
            font-size: 14px;
            color: #fff;
        }
        .status-card {
            background: rgba(17, 24, 39, 0.8);
            border: 1px solid rgba(255,255,255,0.08);
            border-radius: 8px;
            padding: 12px;
            margin-bottom: 12px;
        }
        .status-line {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 6px;
        }
        .status-badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            font-size: 11px;
            font-weight: 600;
            padding: 2px 8px;
            border-radius: 12px;
            background: rgba(16, 185, 129, 0.15);
            color: #34d399;
            border: 1px solid rgba(16, 185, 129, 0.3);
        }
        .dot {
            width: 6px;
            height: 6px;
            background: #10b981;
            border-radius: 50%;
        }
        .info-label {
            color: #9ca3af;
            font-size: 11px;
        }
        .info-val {
            color: #e5e7eb;
            font-family: monospace;
            font-size: 11px;
        }
        .btn {
            width: 100%;
            padding: 8px 0;
            background: #4f46e5;
            color: white;
            border: none;
            border-radius: 6px;
            font-weight: 600;
            cursor: pointer;
            text-align: center;
            text-decoration: none;
            display: block;
            margin-top: 8px;
            font-size: 12px;
        }
        .btn:hover {
            background: #4338ca;
        }
    </style>
</head>
<body>
    <div class="header">
        <img src="icons/icon32.png" alt="Logo" class="logo">
        <div>
            <div class="title">Antigravity Bridge</div>
            <div style="font-size: 10px; color: #818cf8;">Browser Automation Companion</div>
        </div>
    </div>

    <div class="status-card">
        <div class="status-line">
            <span class="info-label">Statut du pont</span>
            <span class="status-badge" id="statusBadge">
                <span class="dot" id="statusDot"></span>
                <span id="statusText">Actif & Prêt</span>
            </span>
        </div>
        <div class="status-line">
            <span class="info-label">Port local</span>
            <span class="info-val">127.0.0.1:9224</span>
        </div>
        <div class="status-line" style="margin-bottom: 0;">
            <span class="info-label">Permissions</span>
            <span class="info-val" style="color: #38bdf8;">Debugger, DOM, CDP</span>
        </div>
    </div>

    <button class="btn" id="btnTest">Tester l'onglet actif</button>
    <div id="output" style="margin-top: 8px; font-size: 11px; color: #9ca3af; word-break: break-all;"></div>

    <script src="popup.js"></script>
</body>
</html>
